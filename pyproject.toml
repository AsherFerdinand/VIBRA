[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vibra-workbench"
version = "0.6.0"
description = "Verified educational structural dynamics and beam FEM workbench"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pydantic>=2.10,<3",
  "plotly>=6,<7",
  "streamlit>=1.45,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "scipy-stubs>=1.14",
    "pandas-stubs>=2.2",
    "matplotlib>=3.9,<4",
]

[project.scripts]
vibra-verify = "vibra.verification.benchmarks:main"
vibra-verify-harmonic = "vibra.verification.harmonic_benchmarks:main"
vibra-verify-transient = "vibra.verification.transient_benchmarks:main"
vibra-verify-signals = "vibra.verification.signal_benchmarks:main"
vibra-verify-installed = "vibra.verification.installed_benchmarks:main"
vibra-installed-study = "vibra.studies.installed_cli:main"
vibra-nvh-study = "vibra.studies.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vibra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/vibra", "frontend", "examples", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
