name: engineering-verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --junitxml=artifacts/pytest.xml
      - run: uv run vibra-verify
      - run: uv run vibra-verify-harmonic
      - run: uv run vibra-verify-transient
      - run: uv run vibra-verify-signals
      - run: uv run vibra-verify-installed
      - run: uv run vibra-verify-stress
      - run: uv run python examples/steel_cantilever.py
      - run: uv run python examples/sdof_resonance.py
      - run: uv run python examples/harmonic_cantilever.py
      - run: uv run python examples/transient_cantilever.py
      - run: uv run python examples/cantilever_signal_diagnostics.py
      - run: uv run python examples/automotive_nvh_study.py
      - run: uv run python examples/installed_motor_study.py
      - run: uv run python examples/beam_stress_viewport.py
      - run: uv run python examples/beginner_workflows.py
      - run: uv build
      - name: Verify installed wheel outside checkout
        run: |
          uv venv /tmp/vibra-wheel --python 3.12
          uv pip install --python /tmp/vibra-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/vibra-wheel/bin/vibra-verify-installed
          /tmp/vibra-wheel/bin/vibra-verify-stress
          /tmp/vibra-wheel/bin/vibra-installed-study
          /tmp/vibra-wheel/bin/python "$GITHUB_WORKSPACE/examples/beginner_workflows.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-verification
          path: artifacts/
